    <!-- Script for Loader and Navbar Highlighting -->
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 700);
                }
            }, 800);
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Mobile Menu Toggle
            const btn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');
            const iconPath = document.getElementById('menu-icon-path');
            const mobileLinks = menu.querySelectorAll('a');

            function toggleMenu() {
                menu.classList.toggle('hidden');
                menu.classList.toggle('flex');
                if (menu.classList.contains('hidden')) {
                    iconPath.setAttribute('d', 'M4 6h16M4 12h16M4 18h16'); // Hamburger
                } else {
                    iconPath.setAttribute('d', 'M6 18L18 6M6 6l12 12'); // X Close
                }
            }

            btn.addEventListener('click', toggleMenu);
            mobileLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (!menu.classList.contains('hidden')) toggleMenu();
                });
            });

            // Multi-page aware active navigation highlighting
            const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
            const navLinks = document.querySelectorAll('.nav-link');

            function syncActiveNav() {
                navLinks.forEach(a => {
                    const href = a.getAttribute('href');
                    if (!href) return;
                    
                    if (href === '/#contact' || href === '#contact') {
                        if (window.location.hash === '#contact') {
                            a.classList.add('text-accent', 'font-bold');
                            if (!a.classList.contains('block')) a.classList.add('border-accent');
                        }
                        return;
                    }

                    const linkPath = href.split('#')[0].replace(/\/$/, '') || '/';
                    if (linkPath === currentPath) {
                        a.classList.add('text-accent', 'font-bold');
                        if (!a.classList.contains('block')) {
                            a.classList.add('border-accent');
                            a.classList.remove('border-transparent');
                        } else {
                            a.classList.add('bg-orange-50', 'text-accent');
                        }
                    }
                });
            }
            syncActiveNav();

            // On home page only, update contact nav on scroll
            if (window.location.pathname === '/' || window.location.pathname === '') {
                const contactSection = document.getElementById('contact');
                if (contactSection) {
                    window.addEventListener('scroll', () => {
                        const contactTop = contactSection.offsetTop - 300;
                        const contactLinks = document.querySelectorAll('a[href="/#contact"], a[href="#contact"]');
                        const homeLinks = document.querySelectorAll('a[href="/"]');

                        if (window.pageYOffset >= contactTop) {
                            contactLinks.forEach(l => l.classList.add('text-accent', 'font-bold'));
                            homeLinks.forEach(l => {
                                l.classList.remove('text-accent', 'font-bold', 'border-accent');
                                l.classList.add('text-secondary', 'border-transparent');
                            });
                        } else {
                            contactLinks.forEach(l => l.classList.remove('text-accent', 'font-bold'));
                            homeLinks.forEach(l => {
                                l.classList.add('text-accent', 'font-bold', 'border-accent');
                                l.classList.remove('text-secondary', 'border-transparent');
                            });
                        }
                    });
                }
            }
        });
    </script>
